# Default values for algotrade-chart.
# Multi-service configuration for backend, frontend, and bot.

backend:
  replicaCount: 1
  image:
    repository: maruvadabalu/algotrade-pro-backend
    pullPolicy: IfNotPresent
    tag: "backend-2026.09.10-dd53df2"
  env:
    - name: DATABASE_URL
      value: "postgresql://postgres:superuser@db:5432/stockdemo"
  service:
    type: ClusterIP
    port: 9999
    targetPort: 9999

frontend:
  replicaCount: 1
  image:
    repository: maruvadabalu/algotrade-pro-frontend
    pullPolicy: IfNotPresent
    tag: "frontend-2026.09.10-dd53df2"
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000

bot:
  replicaCount: 1
  image:
    repository: maruvadabalu/algotrade-pro-bot
    pullPolicy: IfNotPresent
    tag: "bot-2026.09.10-dd53df2"
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: algotrade-app-algotrade-chart-frontend
              port:
                number: 80
        - path: /api
          pathType: Prefix
          backend:
            service:
              name: algotrade-app-algotrade-chart-backend
              port:
                number: 9999
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: {}
affinity: {}