# Default values for algotrade-chart.
# Multi-service configuration for backend, frontend, and bot.

backend:
  replicaCount: 1
  image:
    repository: maruvadabalu/algotrade-pro-backend
    pullPolicy: IfNotPresent
    tag: "backend-2026.09.08-37c4c82"
  env:
    - name: DATABASE_URL
      value: "postgresql://postgres:superuser@db:5432/algotrade"
  service:
    type: ClusterIP
    port: 9999

frontend:
  replicaCount: 1
  image:
    repository: maruvadabalu/algotrade-pro-frontend
    pullPolicy: IfNotPresent
    tag: "frontend-2026.09.08-37c4c82"
  service:
    type: ClusterIP
    port: 80

bot:
  replicaCount: 1
  image:
    repository: maruvadabalu/algotrade-pro-bot
    pullPolicy: IfNotPresent
    tag: "bot-2026.09.08-37c4c82"
  service:
    type: ClusterIP
    port: 8080

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: {}
affinity: {}