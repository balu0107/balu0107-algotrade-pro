name: Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
        action:
          description: 'Terraform Action'
          required: true
          default: 'apply'
          type: choice
          options:
            - apply
            - destroy

permissions:
  id-token: write
  contents: write
  actions: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init -reconfigure
        working-directory: ./terraform

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        env:
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
        run: terraform apply -auto-approve -lock=false
        working-directory: ./terraform

      - name: Update Master IP File and Push
        if: github.event.inputs.action == 'apply'
        run: |
          cd terraform
          MASTER_IP=$(terraform output -raw master_public_ip)
          cd ..
          
          echo "Extracted Master IP: $MASTER_IP"
          echo "$MASTER_IP" > master_ip.txt
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_ip.txt
          git commit -m "chore: update master public ip to $MASTER_IP [skip ci]" || echo "No changes to commit"
          git push || echo "Push skipped"

      - name: Wait for Cloud-Init and SSH Readiness
        if: github.event.inputs.action == 'apply'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ec2_key.pem
          chmod 600 ec2_key.pem

          cd terraform
          MASTER_IP=$(terraform output -raw master_public_ip)
          WORKER_IPS=$(terraform output -json worker_public_ips | jq -r '.[]')
          cd ..

          ALL_IPS="$MASTER_IP $WORKER_IPS"

          echo "Waiting for instances to accept SSH connections..."
          for ip in $ALL_IPS; do
            echo "Checking $ip..."
            until ssh -i ec2_key.pem -o StrictHostKeyChecking=no -o ConnectTimeout=5 ubuntu@$ip "echo 'Ready'"; do
              sleep 5
            done
          done
          echo "All instances are online and ready!"

      - name: Run Ansible Configuration & Kubernetes Setup
        if: github.event.inputs.action == 'apply'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y ansible
          
          cd terraform
          MASTER_IP=$(terraform output -raw master_public_ip)
          WORKER_IPS=$(terraform output -json worker_public_ips | jq -r '.[]')
          cd ..

          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ec2_key.pem
          chmod 600 ec2_key.pem

          mkdir -p ansible
          cat <<EOF > ansible/inventory.ini
          [master]
          $MASTER_IP ansible_user=ubuntu ansible_ssh_private_key_file=./ec2_key.pem ansible_ssh_common_args='-o IdentitiesOnly=yes -o StrictHostKeyChecking=no'

          [workers]
          EOF
          for ip in $WORKER_IPS; do
            echo "$ip ansible_user=ubuntu ansible_ssh_private_key_file=./ec2_key.pem ansible_ssh_common_args='-o IdentitiesOnly=yes -o StrictHostKeyChecking=no'" >> ansible/inventory.ini
          done

          cat << 'EOF' > ansible/playbook.yml
          - hosts: all
            become: yes
            tasks:
              - name: Disable swap permanently
                shell: |
                  swapoff -a
                  sed -i '/ swap / s/^/#/' /etc/fstab

              - name: Load required kernel modules for containerd
                copy:
                  dest: /etc/modules-load.d/k8s.conf
                  content: |
                    overlay
                    br_netfilter

              - name: Load modules immediately
                shell: |
                  modprobe overlay
                  modprobe br_netfilter

              - name: Configure sysctl networking parameters for Kubernetes
                copy:
                  dest: /etc/sysctl.d/k8s.conf
                  content: |
                    net.bridge.bridge-nf-call-iptables  = 1
                    net.bridge.bridge-nf-call-ip6tables = 1
                    net.ipv4.ip_forward                 = 1

              - name: Apply sysctl params without reboot
                command: sysctl --system

              - name: Install prerequisite packages
                apt:
                  name:
                    - apt-transport-https
                    - ca-certificates
                    - curl
                    - gpg
                    - containerd
                  state: present
                  update_cache: yes

              - name: Configure containerd default settings
                shell: |
                  mkdir -p /etc/containerd
                  containerd config default > /etc/containerd/config.toml
                  sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
                  systemctl restart containerd
                  systemctl enable containerd

              - name: Create apt keyrings directory
                file:
                  path: /etc/apt/keyrings
                  state: directory
                  mode: '0755'

              - name: Download Kubernetes apt repository key
                shell: |
                  curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

              - name: Add Kubernetes repository source
                copy:
                  dest: /etc/apt/sources.list.d/kubernetes.list
                  content: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /\n"

              - name: Install kubelet, kubeadm, and kubectl
                apt:
                  name:
                    - kubelet
                    - kubeadm
                    - kubectl
                  state: present
                  update_cache: yes

              - name: Hold Kubernetes packages at version
                dpkg_selections:
                  name: "{{ item }}"
                  selection: hold
                loop:
                  - kubelet
                  - kubeadm
                  - kubectl

          - hosts: master
            become: yes
            tasks:
              - name: Initialize Kubernetes Control Plane
                shell: kubeadm init --pod-network-cidr=192.168.0.0/16
                args:
                  creates: /etc/kubernetes/admin.conf

              - name: Create .kube directory for ubuntu user
                file:
                  path: /home/ubuntu/.kube
                  state: directory
                  owner: ubuntu
                  group: ubuntu
                  mode: '0755'

              - name: Copy admin.conf to ubuntu user's home
                copy:
                  src: /etc/kubernetes/admin.conf
                  dest: /home/ubuntu/.kube/config
                  remote_src: yes
                  owner: ubuntu
                  group: ubuntu
                  mode: '0600'

              - name: Install Calico CNI
                become: no
                shell: export KUBECONFIG=/home/ubuntu/.kube/config && kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.26.1/manifests/calico.yaml

              - name: Generate worker join command
                shell: kubeadm token create --print-join-command
                register: join_command

              - name: Save join command locally for workers
                delegate_to: localhost
                become: no
                copy:
                  content: "{{ join_command.stdout }}"
                  dest: ./join_command.sh

          - hosts: workers
            become: yes
            tasks:
              - name: Reset existing kubeadm state if any
                shell: kubeadm reset -f || true

              - name: Remove old CNI configs
                file:
                  path: /etc/cni/net.d
                  state: absent

              - name: Copy join command from localhost
                copy:
                  src: ./join_command.sh
                  dest: /tmp/join_command.sh
                  mode: '0755'

              - name: Execute join command on worker node
                shell: /tmp/join_command.sh
          EOF

          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -auto-approve -lock=false
        working-directory: ./terraform