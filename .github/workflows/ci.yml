name: CI Build, Scan & Push

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Version Tags
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: maruvadabalu/algotrade-pro:backend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'maruvadabalu/algotrade-pro:backend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}'
          format: 'table'
          output: 'backend-trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-vulnerability-report
          path: backend-trivy-report.txt

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            maruvadabalu/algotrade-pro:backend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
            maruvadabalu/algotrade-pro:backend-latest

  build-frontend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Version Tags
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: maruvadabalu/algotrade-pro:frontend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'maruvadabalu/algotrade-pro:frontend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}'
          format: 'table'
          output: 'frontend-trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vulnerability-report
          path: frontend-trivy-report.txt

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            maruvadabalu/algotrade-pro:frontend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
            maruvadabalu/algotrade-pro:frontend-latest

  build-bot:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Version Tags
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          push: false
          tags: maruvadabalu/algotrade-pro:bot-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'maruvadabalu/algotrade-pro:bot-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}'
          format: 'table'
          output: 'bot-trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-vulnerability-report
          path: bot-trivy-report.txt

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          push: true
          tags: |
            maruvadabalu/algotrade-pro:bot-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
            maruvadabalu/algotrade-pro:bot-latest