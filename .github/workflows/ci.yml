name: CI Build, Scan & Push

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  ci-build-scan-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend, bot]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: ${{ secrets.DOCKER_USERNAME }}/corp-${{ matrix.service }}:${{ github.sha }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/corp-${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/corp-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/corp-${{ matrix.service }}:latest
