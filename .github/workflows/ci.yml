name: CI Build, Scan & Push

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Version Tags
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: maruvadabalu/algotrade-pro-backend:backend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'maruvadabalu/algotrade-pro-backend:backend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}'
          format: 'table'
          output: 'backend-trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-vulnerability-report
          path: backend-trivy-report.txt

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            maruvadabalu/algotrade-pro-backend:backend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
            maruvadabalu/algotrade-pro-backend:latest

  build-frontend:
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Version Tags
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: maruvadabalu/algotrade-pro-frontend:frontend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'maruvadabalu/algotrade-pro-frontend:frontend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}'
          format: 'table'
          output: 'frontend-trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-vulnerability-report
          path: frontend-trivy-report.txt

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            maruvadabalu/algotrade-pro-frontend:frontend-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
            maruvadabalu/algotrade-pro-frontend:latest

  build-bot:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Version Tags
        id: vars
        run: |
          echo "BUILD_DATE=$(date +'%Y.%m.%d')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          push: false
          tags: maruvadabalu/algotrade-pro-bot:bot-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
          load: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'maruvadabalu/algotrade-pro-bot:bot-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}'
          format: 'table'
          output: 'bot-trivy-report.txt'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bot-vulnerability-report
          path: bot-trivy-report.txt

      - name: Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./bot
          push: true
          tags: |
            maruvadabalu/algotrade-pro-bot:bot-${{ env.BUILD_DATE }}-${{ env.SHORT_SHA }}
            maruvadabalu/algotrade-pro-bot:latest

  update-helm-manifests:
    needs: [build-backend, build-frontend, build-bot]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Helm Chart Values
        run: |
          BUILD_DATE=$(date +'%Y.%m.%d')
          SHORT_SHA=$(git rev-parse --short HEAD)
          
          sed -i "/backend:/,/tag:/ s/tag: .*/tag: \"backend-$BUILD_DATE-$SHORT_SHA\"/" algotrade-chart/values.yaml
          sed -i "/frontend:/,/tag:/ s/tag: .*/tag: \"frontend-$BUILD_DATE-$SHORT_SHA\"/" algotrade-chart/values.yaml
          sed -i "/bot:/,/tag:/ s/tag: .*/tag: \"bot-$BUILD_DATE-$SHORT_SHA\"/" algotrade-chart/values.yaml

      - name: Commit and Push Image Tag Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add algotrade-chart/values.yaml
          git commit -m "chore: update helm chart tags to $BUILD_DATE-$SHORT_SHA [skip ci]" || echo "No changes to commit"
          git push

  get-master-ip:
    runs-on: ubuntu-latest
    outputs:
      master_ip: ${{ steps.tf-output.outputs.ip }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Get Master IP from Terraform
        id: tf-output
        run: |
          IP=$(terraform output -raw master_public_ip)
          echo "ip=$IP" >> $GITHUB_OUTPUT

  deploy-to-master:
    needs: [update-helm-manifests, get-master-ip]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Master Bootstrap on EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.get-master-ip.outputs.master_ip }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            git pull origin main || true
            chmod +x master_bootstrap.sh
            ./master_bootstrap.sh
            cat /var/log/algotrade/access-url.log